<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>궁중 수라간 | 회원가입</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/signup.js" defer></script>
</head>
<body>
<div class="container page-shell">

  <section class="hero">
    <div class="hero-badge">가입 · Royal Membership</div>
    <h1 class="hero-title">궁중 수라간 회원가입</h1>
    <p class="hero-subtitle">
      서비스를 이용할 사용자의 기본 정보를 등록하는 단계입니다.
      고객과 점주 모두 가입 가능하며, 기존 스크립트 동작은 그대로 유지됩니다.
    </p>
  </section>

  <section class="card">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">籍</div>
        <div class="brand-text">
          <h2>가입 정보 입력</h2>
          <p>필수 정보를 입력하고 서비스 역할을 선택하세요.</p>
        </div>
      </div>
      <span class="badge">SIGN UP</span>
    </div>

    <div class="row">
      <div>
        <label for="nickname">아이디</label>
        <div class="input-with-button">
          <input id="nickname" type="text" placeholder="아이디를 입력하세요" />
          <button type="button" class="inline-button secondary" onclick="checkNickname()">
            중복체크
          </button>
        </div>
        <div id="nicknameStatusMessage" class="status-message"></div>
      </div>

      <div>
        <label for="phone">전화번호</label>
        <input id="phone" type="text" placeholder="010-0000-0000" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="email">이메일</label>

        <div class="input-with-button">
          <input id="email" type="email" placeholder="example@suratgan.com" />
          <button type="button" class="inline-button secondary" onclick="sendEmailCode()">
            인증번호 받기
          </button>
        </div>

        <div id="emailStatusMessage" class="status-message"></div>

        <div id="emailVerifySection" class="verify-section">
          <label for="emailCode">이메일 인증번호</label>
          <div class="input-with-button">
            <input id="emailCode" type="text" placeholder="인증번호를 입력하세요" />
            <button type="button" class="inline-button secondary" onclick="verifyEmailCode()">
              인증 확인
            </button>
          </div>
        </div>
      </div>

      <div>
        <label for="password">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호를 입력하세요" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="role">권한</label>
        <select id="role">
          <option value="">권한을 선택하세요</option>
          <option value="CUSTOMER">CUSTOMER</option>
          <option value="OWNER">OWNER</option>
        </select>
      </div>

      <div>
        <label for="address">주소</label>
        <input id="address" type="text" placeholder="기본 주소를 입력하세요" />
      </div>
    </div>

    <p class="form-note">
      아이디 중복 확인과 이메일 인증 완료 후 회원가입을 진행해주세요.
    </p>

    <button type="button" onclick="signup()">회원가입 완료</button>

    <div class="divider"></div>

    <div class="actions">
      <a href="./login.html" class="nav-card" style="padding: 14px 18px; flex: 1; min-width: 220px;">
        <h4 class="nav-card-title" style="margin-bottom: 4px;">로그인으로 이동</h4>
        <p class="nav-card-desc">가입 완료 후 바로 로그인 단계로 넘어갑니다.</p>
      </a>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <h3 class="card-title">회원가입 결과</h3>
    </div>
    <p class="form-note">
      성공 메시지 또는 오류 응답이 아래 영역에 표시됩니다.
    </p>

    <div class="result-box">
      <p class="result-title">RESULT</p>
      <pre id="result"></pre>
    </div>
  </section>

</div>
</body>
</html>
