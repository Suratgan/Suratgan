<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>궁중 수라간 | 결제 성공</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<div class="container page-shell">

    <section class="hero">
        <div class="hero-badge">PAYMENT RESULT</div>
        <h1 class="hero-title">결제가 성공적으로 완료되었습니다 🎉</h1>
        <p class="hero-subtitle">
            궁중 수라간 주문 결제가 정상 처리되었습니다.
            아래에서 결제 정보를 확인하실 수 있습니다.
        </p>
    </section>

    <section class="card">
        <div class="section-title">
            <h3 class="card-title">결제 결과 정보</h3>
        </div>

        <div class="result-box">
            <p class="result-title">SUCCESS RESPONSE</p>
            <pre id="successResult"></pre>
        </div>

        <div class="actions" style="margin-top: 20px;">
            <a href="./app.html" class="nav-card" style="flex:1; min-width:200px;">
                <h4 class="nav-card-title">서비스 화면으로 돌아가기</h4>
                <p class="nav-card-desc">주문 · 리뷰 · 관리 화면으로 이동합니다.</p>
            </a>
        </div>
    </section>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const result = Object.fromEntries(params.entries());

    document.getElementById("successResult").textContent =
        JSON.stringify(result, null, 2);
</script>

</body>
</html>
