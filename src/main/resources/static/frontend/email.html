<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>이메일 인증</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/email.js" defer></script>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>이메일 인증 요청</h2>
    <input id="requestEmail" type="email" placeholder="email 입력" />
    <button onclick="requestEmailCode()">인증코드 요청</button>
  </div>

  <div class="card">
    <h2>이메일 인증 확인</h2>
    <input id="verifyEmail" type="email" placeholder="email 입력" />
    <input id="verifyCode" type="text" placeholder="code 입력" />
    <button onclick="verifyEmailCode()">이메일 인증 완료</button>
  </div>

  <div class="card">
    <h3>결과</h3>
    <pre id="result"></pre>
    <a href="./signup.html">회원가입으로 이동</a>
  </div>
</div>
</body>
</html>
