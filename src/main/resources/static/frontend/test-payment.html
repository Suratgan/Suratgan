<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>수라간 결제 테스트 (최종)</title>
    <script src="https://js.tosspayments.com/v1"></script>
</head>
<body>
<div style="text-align: center; margin-top: 50px;">
    <h2>🍱 수라간 주문 테스트</h2>
    <button id="pay-button" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background: #3182f6; color: white; border: none; border-radius: 8px;">
        카드 결제하기
    </button>
</div>

<script>
    // ⚠️ 여기를 사용자님 대시보드 하단의 'API 개별 연동 키'로 바꾸세요!
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const tossPayments = TossPayments(clientKey);

    document.getElementById('pay-button').onclick = function() {
        tossPayments.requestPayment('카드', {
            amount: 15000,
            // PostgreSQL DB(p_order)에 있는 실제 주문 UUID를 넣어야 합니다. [cite: 2026-02-24, 2026-02-25]
            orderId: "ORDER_" + new Date().getTime(),
            orderName: "수라간 테스트 주문",
            successUrl: window.location.origin + "/success.html",
            failUrl: window.location.origin + "/fail.html",
        }).catch(function (error) {
            if (error.code === 'USER_CANCEL') {
                alert('결제를 취소하셨습니다.');
            } else {
                alert(error.message);
            }
        });
    };
</script>
</body>
</html>
