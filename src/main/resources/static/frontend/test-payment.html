<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>수라간 결제 (배포 준비 완료)</title>
</head>
<body>
<div style="text-align: center; margin-top: 50px;">
    <h2>🍱 수라간 주문하기</h2>

    <div style="margin-bottom: 20px;">
        이름: <input type="text" id="userName" value="박수라"><br>
        이메일: <input type="email" id="userEmail" value="test@suratgan.com">
    </div>

    <button id="pay-button" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background: #3182f6; color: white; border: none; border-radius: 8px;">
        결제하기
    </button>
</div>

<script src="https://js.tosspayments.com/v2/standard"></script>

<script>
    const clientKey = "test_ck_eqRGgYO1r5yAWNA95JybrQnN2Eya";
    const tossPayments = TossPayments(clientKey);


    function getStoreIdFromUrl() {
        return "YOUR-ACTUAL-STORE-UUID";
    }

    function getItemsFromCart() {

        return [
            { menuId: "YOUR-ACTUAL-MENU-UUID", quantity: 1 }
        ];
    }

    async function requestOrder() {
        try {
            const orderRequest = {
                storeId: getStoreIdFromUrl(),
                ordererName: document.getElementById('userName').value,
                ordererEmail: document.getElementById('userEmail').value,
                ordererMobile: "010-0000-0000",
                items: getItemsFromCart()
            };


            const response = await fetch('/api/v1/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderRequest)
            });

            if (!response.ok) throw new Error("주문 생성 실패!");
            const data = await response.json(); // { orderId, amount, storeName }

            const payment = tossPayments.payment({
                customerKey: "SURAGAN_USER_" + data.orderId.substring(0, 8),
            });

            await payment.requestPayment({
                method: "CARD",
                amount: { currency: "KRW", value: data.amount },
                orderId: data.orderId,
                orderName: data.storeName + " 주문",
                successUrl: window.location.origin + "/frontend/success.html",
                failUrl: window.location.origin + "/frontend/fail.html",
            });

        } catch (error) {
            console.error("오류 발생:", error);
            alert(error.message);
        }
    }

    document.getElementById('pay-button').addEventListener('click', requestOrder);
</script>
</body>
</html>
